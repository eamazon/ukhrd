name: publish
# When changed data lands on main (a merged "NHS Data Dictionary changed" pull request, or a person's own
# commit): test it, build ukhrd.db from the files, and attach it to a new GitHub release with the NHS credit.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "!data/fetches.csv"
      - "!data/README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ukhrd-data

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test
        run: |
          pip install -q -r requirements.txt -r requirements-export.txt
          python -m pytest -q

      - name: Build the database and the Parquet files from the files
        run: |
          python cli.py load
          python scripts/export_parquet.py release
          python scripts/build_bundle.py release

      - name: Release it
        run: |
          python - <<'PY'
          import csv, datetime, os
          last = [r for r in csv.DictReader(open("data/fetches.csv")) if r["outcome"] == "success"][-1]
          day = datetime.date.today().isoformat()
          open("tag.txt", "w").write(f"data-{day}-{os.environ['GITHUB_SHA'][:7]}")
          open("title.txt", "w").write(f"Data {day} — NHS Data Dictionary, {last['release_label']}")
          open("notes.md", "w").write(
              f"Built from `data/` at this commit. Latest check: {last['detail']}.\n\n"
              "- **`ukhrd.db`** — the SQLite database. Open it with any tool that reads SQLite; start with "
              "`ref_list_directory`.\n"
              "- **`codes.parquet`** — every version of every code, all lists in one table. **`lists.parquet`** — "
              "every version of every list, with its NHS page. For DuckDB, Snowflake, Fabric, Power BI.\n"
              "- These links always point at the newest release: "
              "`https://github.com/eamazon/ukhrd/releases/latest/download/codes.parquet` (and `lists.parquet`, "
              "`ukhrd.db`). How to use them: `docs/QUERIES.md`.\n"
              "- **`ukhrd.mcpb`** — the MCP server as a one-click bundle for desktop AI apps that support MCP "
              "Bundles. It downloads the newest data itself.\n"
              "- What changed is in the commit history of `data/`.\n\n"
              "**Where the data comes from.** Contains information from NHS England, licensed under the current "
              "version of the [Open Government Licence](https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/). "
              "Codes and descriptions are copied exactly as published. UKHRD is independent and not endorsed by "
              "NHS England; the [NHS Data Model and Dictionary](https://www.datadictionary.nhs.uk/) is the authority.\n")
          PY
          gh release create "$(cat tag.txt)" ukhrd.db release/codes.parquet release/lists.parquet release/ukhrd.mcpb --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md
